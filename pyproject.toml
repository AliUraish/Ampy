[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seller-scout-agents"
version = "0.1.0"
description = "Mistral-powered seller negotiation and local sourcing event agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "mistralai>=1.9,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
